name: Build Matrix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runs_on: ubuntu-latest
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
          - name: macos-x64
            runs_on: macos-13
          - name: macos-arm64
            runs_on: macos-14
          - name: windows-x64
            runs_on: windows-latest
          # Attempt cross-compile for Windows ARM64 (may lack toolchain)
          - name: windows-arm64-cross
            runs_on: windows-latest
            target: aarch64-pc-windows-msvc
            allow_failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Add target (if cross-compiling)
        if: ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi
        shell: bash

      - name: Test (native only)
        if: ${{ !matrix.target }}
        run: cargo test --all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-${{ matrix.name }}
          path: |
            target/**/release/hephaestus*
